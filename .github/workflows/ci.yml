name: CI

# A cada commit (de pessoa ou de agente): lint, testes em Linux e Windows, validação do cofre,
# teste do `cerebro init` e o painel publicado no GitHub Pages.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_run:  # a avaliação grava resultados/ com o token do Actions, que não dispara push: atualiza o painel aqui
    workflows: ["Avaliação"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  testes:
    if: github.event_name != 'workflow_run'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests
      - name: Testes
        run: pytest -q --cov=cerebro --cov-report=term-missing:skip-covered --cov-fail-under=80
      - name: Validar o cofre
        run: cerebro validar
      - name: Cofre novo com cerebro init
        shell: bash
        run: |
          cerebro init "$RUNNER_TEMP/novo"
          cerebro --cofre "$RUNNER_TEMP/novo" validar

  painel:
    needs: testes
    if: always() && (needs.testes.result == 'success' || needs.testes.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e .
      - name: Gerar o painel
        run: cerebro painel --html site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  publicar:
    if: always() && needs.painel.result == 'success' && github.ref == 'refs/heads/main'
    needs: painel
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
