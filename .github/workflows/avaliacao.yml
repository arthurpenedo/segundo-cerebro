name: Avaliação

# Roda os cenários da equipe de agentes com modelos abertos de verdade (Ollama na CPU do runner, custo zero)
# e grava as métricas em resultados/. O painel lê esses arquivos.
# Um job por modelo e cenário, em paralelo; o último job junta tudo num JSON por modelo.
on:
  push:
    branches: [main]
    paths: ["src/cerebro/agente.py", "src/cerebro/ferramentas.py", "src/cerebro/orquestrador.py",
            "src/cerebro/llm.py", "src/cerebro/avaliacao.py", "src/cerebro/busca.py", "src/cerebro/mural.py",
            "src/cerebro/cenarios.yaml", "src/cerebro/modelo/**", ".github/workflows/avaliacao.yml"]
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"  # toda segunda

permissions:
  contents: write

concurrency:
  group: avaliacao
  cancel-in-progress: true

jobs:
  cenario:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        modelo: ["qwen2.5:3b", "qwen2.5:7b"]
        cenario: [nota-de-conceito, status-com-fonte, post-revisado, entrevista, nao-publica-sozinho]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e .
      - name: Instalar o Ollama
        run: curl -fsSL https://ollama.com/install.sh | sh
      - name: Subir o Ollama e baixar o modelo
        run: |
          nohup ollama serve > ollama.log 2>&1 &
          for i in $(seq 1 30); do curl -sf localhost:11434/api/tags >/dev/null && break; sleep 2; done
          ollama pull "${{ matrix.modelo }}"
      - name: Avaliar
        run: |
          nome=$(echo "${{ matrix.modelo }}" | tr ':' '-')
          echo "NOME=$nome" >> $GITHUB_ENV
          cerebro avaliar --modelo "${{ matrix.modelo }}" --cenario "${{ matrix.cenario }}" \
            --saida "parciais/$nome/${{ matrix.cenario }}.json" || echo "cenário terminou com erro; guardo o parcial"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: parcial-${{ env.NOME }}-${{ matrix.cenario }}
          path: parciais/
          if-no-files-found: ignore

  juntar:
    needs: cenario
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e .
      - uses: actions/download-artifact@v4
        with:
          pattern: parcial-*
          path: parciais/
          merge-multiple: true
      - name: Juntar e gravar no repositório
        run: |
          for modelo in qwen2.5:3b qwen2.5:7b; do
            nome=$(echo "$modelo" | tr ':' '-')
            ls parciais/$nome/*.json >/dev/null 2>&1 || continue
            cerebro avaliar --modelo "$modelo" --juntar parciais/$nome/*.json --saida "resultados/$nome.json"
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash
          git add resultados/
          git commit -m "Avaliação: qwen2.5:3b e qwen2.5:7b" || exit 0
          git push
